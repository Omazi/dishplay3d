name: DishPlayCapture
options:
  bundleIdPrefix: app.dishplay
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  minimumXcodeGenVersion: "2.46.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.5.0"
targets:
  DishPlayCapture:
    type: application
    platform: iOS
    sources:
      - DishPlayCapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dishplay.capture
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: DishPlayCapture/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  DishPlayCapture:
    build:
      targets:
        DishPlayCapture: all
    run:
      config: Debug
    archive:
      config: Release
