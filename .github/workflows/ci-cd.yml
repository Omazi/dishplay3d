name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dishplay-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'
  UV_THREADPOOL_SIZE: '1'

jobs:
  verify:
    name: Typecheck, tests, build and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: python3 -m unittest discover -s worker/tests
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy verified commit to Vercel
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    environment:
      name: production
      url: https://dishplay3d.vercel.app
    env:
      DEPLOYMENT_URL: https://dishplay3d.vercel.app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Advance the verified production branch
        id: release
        run: |
          release_commit=$(node scripts/prepare-release.mjs)
          git push origin "$release_commit:refs/heads/production"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
      - name: Wait for the exact commit on Vercel
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: node scripts/wait-for-deployment.mjs "$DEPLOYMENT_URL" "$RELEASE_COMMIT" "$GITHUB_SHA"
      - name: Check live public menu
        run: node scripts/smoke.mjs "$DEPLOYMENT_URL"
