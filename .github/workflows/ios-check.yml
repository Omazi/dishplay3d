name: DishPlay Scan — checks

# Backend tests on Linux + ScanCore unit tests and an unsigned iOS device build on macOS.
# Each change is checked ONCE:
#  - only pushes to main start it (the working branch is a copy of main: checking it again told nothing new);
#  - a release push (ios/RELEASE_NOTES.txt changed) is checked inside the TestFlight workflow, which calls
#    this file with `release: true`; the stand-alone run then steps aside (job "gate").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Called by the TestFlight workflow (this is the release's own check)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scan-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: decide
        env:
          RELEASE_CALL: ${{ inputs.release }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          run=true
          if [ "$RELEASE_CALL" != "true" ] && [ "$EVENT" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qx 'ios/RELEASE_NOTES.txt'; then
              run=false
              echo "Release push: the same checks run inside the TestFlight workflow; not repeated here."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  backend:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned dependencies (system Python 3.12 of ubuntu-24.04)
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install -q -r requirements.lock
      - name: Unit, integration and end-to-end tests
        run: .venv/bin/python -m pytest -q -p no:cacheprovider
      - name: Doctor (includes a synthetic self-test of the chain)
        run: .venv/bin/python ../tools/doctor.py || true

  ios:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Select the newest installed Xcode 26 and record versions
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XC/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos
          swift --version
      - name: ScanCore unit tests (coordinates, wire formats, capture heuristics; Python golden vectors)
        working-directory: ios/ScanCore
        run: swift test
      - name: Install pinned XcodeGen (2.46.0, SHA-256 verified)
        run: echo "XCODEGEN=$(bash ios/ci/install-xcodegen.sh)" >> "$GITHUB_ENV"
      - name: Generate project and build for iPhone (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p build
          "$XCODEGEN" --version
          "$XCODEGEN" generate --spec project.yml
          xcodebuild -project DishPlayScan.xcodeproj -scheme DishPlayScan -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build > build/xcodebuild.log 2>&1 || { grep -E "error:" build/xcodebuild.log; tail -40 build/xcodebuild.log; exit 1; }
          grep -E "warning: .*\.swift|BUILD SUCCEEDED" build/xcodebuild.log || true
      - name: Check bundle contents
        working-directory: ios
        run: |
          APP=$(find build/DerivedData/Build/Products -name "DishPlayScan.app" -maxdepth 3 | head -1)
          test -f "$APP/default.metallib"
          test -f "$APP/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c "Print :NSLocalNetworkUsageDescription" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scan-ios-build-log
          path: ios/build/xcodebuild.log
          retention-days: 7
