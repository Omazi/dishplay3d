name: DishPlay Scan — TestFlight

# Manual: Actions -> "DishPlay Scan — TestFlight" -> Run workflow.
# Publishes to the EXISTING App Store Connect record "DishPlay Capture" (ID 6814221035, bundle
# app.dishplay.capture) with the signing secrets already used for 0.1.0-0.6.0 (see docs/TESTFLIGHT.md).
on:
  # A release is requested by editing ios/RELEASE_NOTES.txt on main (or manually below).
  push:
    branches: [main]
    paths: ['ios/RELEASE_NOTES.txt']
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed build to App Store Connect (TestFlight)
        required: true
        default: true
        type: boolean

# The name of a run says whether it sends anything: the workflow that follows (testflight-assign) reads it.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.upload == false && 'Build only (nothing sent to Apple)' || 'TestFlight release' }}

permissions:
  contents: read
  actions: read    # the gate asks for the screen checks that succeeded

concurrency:
  group: scan-testflight
  cancel-in-progress: false

jobs:
  # Nothing is sent to Apple unless the screen check succeeded on this very app (three walks) and the notes name
  # the app's version (ios/ci/release-gate.py). Version 1.7.0 reached the testers before its pictures existed.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: The pictures of this very app exist, and the notes name its version
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
        run: python3 ios/ci/release-gate.py
  check:
    needs: gate
    uses: ./.github/workflows/ios-check.yml
    with:
      release: true
  distribute:
    needs: [gate, check]
    runs-on: macos-15
    timeout-minutes: 40
    environment:
      name: testflight
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_KEY_ID: ${{ vars.APPLE_KEY_ID }}
      APPLE_ISSUER_ID: ${{ vars.APPLE_ISSUER_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'app.dishplay.capture' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Select the project's Xcode (ios/ci/select-xcode.sh)
        run: |
          DEVELOPER_DIR=$(bash ios/ci/select-xcode.sh)
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$DEVELOPER_DIR" xcodebuild -version
      - name: App Store profile (existing secret; API fallback only if absent)
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          EXISTING_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -n "$EXISTING_PROFILE" ]; then
            echo "Using the existing IOS_PROVISION_PROFILE_BASE64 secret (validated by install-signing.py)"
            echo "IOS_PROVISION_PROFILE_BASE64=$EXISTING_PROFILE" >> "$GITHUB_ENV"
          else
            python3 -m venv "$RUNNER_TEMP/asc" && "$RUNNER_TEMP/asc/bin/pip" install -q cryptography==46.0.3
            "$RUNNER_TEMP/asc/bin/python" tools/asc_profile.py --bundle "$IOS_BUNDLE_ID" --name "DishPlay Capture" \
              --out "$RUNNER_TEMP/scan.mobileprovision" --github-env
          fi
      - name: Validate and install signing material (shared script)
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: python3 ios/ci/install-signing.py
      - name: Install pinned XcodeGen
        run: echo "XCODEGEN=$(bash ios/ci/install-xcodegen.sh)" >> "$GITHUB_ENV"
      - name: Archive (signed)
        working-directory: ios
        run: |
          "$XCODEGEN" generate --spec project.yml
          xcodebuild -project DishPlayScan.xcodeproj -scheme DishPlayScan -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/DishPlayScan.xcarchive -derivedDataPath build/DerivedData \
            "PRODUCT_BUNDLE_IDENTIFIER=$IOS_BUNDLE_ID" \
            "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
            "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            "PROVISIONING_PROFILE_SPECIFIER=$SIGNING_PROFILE_UUID" \
            "OTHER_CODE_SIGN_FLAGS=--keychain $SIGNING_KEYCHAIN" archive
      - name: Export signed IPA
        working-directory: ios
        run: |
          xcodebuild -exportArchive -archivePath build/DishPlayScan.xcarchive \
            -exportPath build/export -exportOptionsPlist "$APPLE_EXPORT_OPTIONS"
          ls -la build/export
      - name: Validate with Apple and upload for TestFlight
        if: github.event_name == 'push' || inputs.upload
        working-directory: ios
        run: |
          export API_PRIVATE_KEYS_DIR="$(dirname "$APPLE_API_KEY_PATH")"
          IPA=$(ls build/export/*.ipa | head -1)
          # altool can print ERROR yet exit 0 (e.g. missing Apple agreement): fail explicitly.
          for action in --validate-app --upload-app; do
            xcrun altool $action --type ios --file "$IPA" --apiKey "$APPLE_KEY_ID" --apiIssuer "$APPLE_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool.log"
            if [ "${PIPESTATUS[0]}" != "0" ] || grep -q "ERROR" "$RUNNER_TEMP/altool.log"; then
              echo "::error::App Store Connect refused $action (see log above)"; exit 1
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dishplay-scan-ipa-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ios/build/export/*.ipa
            ios/build/DishPlayScan.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        run: test ! -f ios/ci/cleanup-signing.py || python3 ios/ci/cleanup-signing.py
