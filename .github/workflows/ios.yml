name: iOS manual verification (legacy)

on:
  # iOS automation is moving to Xcode Cloud. Retain an explicit manual fallback.
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify native capture, camera, geometry, video and signing guards
        run: bash scripts/apple/verify-native.sh
      - name: Download pinned project generator
        run: bash scripts/apple/xcodegen.sh
      - name: Generate project and archive the iOS release target
        working-directory: native/ios
        run: |
          xcodebuild -version
          xcodegen --version
          xcodegen generate --spec project.yml
          xcodebuild -project DishPlayCapture.xcodeproj -scheme DishPlayCapture \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData -archivePath build/DishPlayCapture.xcarchive \
            -jobs 1 CODE_SIGNING_ALLOWED=NO archive
      - name: Validate the packaged release resources
        run: python3 scripts/apple/validate-bundle.py native/ios/build/DishPlayCapture.xcarchive/Products/Applications/DishPlayCapture.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-unsigned-build
          path: native/ios/build/DishPlayCapture.xcarchive/Products/Applications/DishPlayCapture.app
          if-no-files-found: error
          retention-days: 7

  camera-ui:
    name: Camera startup UI on iPhone simulator
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download pinned project generator
        run: bash scripts/apple/xcodegen.sh
      - name: Check camera failure, recovery and screen layout
        run: bash scripts/apple/test-camera-ui.sh
      - name: Keep camera screen evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-camera-ui-evidence
          path: |
            native/ios/build/CameraUI.xcresult
            native/ios/build/camera-evidence/
          if-no-files-found: warn
          retention-days: 7
