name: DishPlay Scan — TestFlight assign

# After each TestFlight upload (and once when this file changes): wait for Apple's processing,
# report the real build state, set export compliance and add the build to the internal group.
on:
  workflow_run:
    workflows: ["DishPlay Scan — TestFlight"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['tools/asc_testflight.py', '.github/workflows/testflight-assign.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assign:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment:
      name: testflight
    env:
      APPLE_KEY_ID: ${{ vars.APPLE_KEY_ID }}
      APPLE_ISSUER_ID: ${{ vars.APPLE_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Wait for Apple processing and assign to "DishPlay - Tests iPhone"
        run: |
          python3 -m venv "$RUNNER_TEMP/asc" && "$RUNNER_TEMP/asc/bin/pip" install -q cryptography==46.0.3
          # After an upload, wait for exactly that build (run_number.run_attempt); otherwise take the latest.
          BUILD=""
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            BUILD="--build ${{ github.event.workflow_run.run_number }}.${{ github.event.workflow_run.run_attempt }}"
          fi
          "$RUNNER_TEMP/asc/bin/python" tools/asc_testflight.py --bundle "${{ vars.IOS_BUNDLE_ID || 'app.dishplay.capture' }}" --group "DishPlay - Tests iPhone" $BUILD

  # Asked by the owner: the repository is public only for the time of a release. Once the build is
  # processed by Apple and given to the testers, it is made private again. Needs a repository secret
  # REPO_ADMIN_TOKEN (fine-grained token, this repository only, permission "Administration: write");
  # without it this job only prints a reminder.
  make-private:
    needs: assign
    if: github.event_name == 'workflow_run' && needs.assign.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Make the repository private again
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::REPO_ADMIN_TOKEN is not set: the repository stays public. Make it private by hand (Settings > Danger Zone)."
            exit 0
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY" -F private=true --jq '"visibility: " + .visibility'
