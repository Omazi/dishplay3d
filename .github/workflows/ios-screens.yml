name: DishPlay Scan — screens

# Opens every screen of the app in the iPhone simulator and keeps a picture of each, with the findings of
# Apple's accessibility audit (ios/UITests). Nothing is judged automatically: the pictures are looked at.
# On the reference iPhone it also runs the tests of the app's logic (ScanCore, then ios/AppTests inside the
# app): a release needs a successful run of this workflow, so it needs them too.
# It costs macOS minutes, so it only runs when asked: change ios/UITests/RUN.txt, or start it by hand.
# RUN.txt also says how much to do (one walk only, one iPhone or the four machines).
on:
  push:
    branches: [main, 'claude/**']
    paths: ['ios/UITests/RUN.txt']
  workflow_dispatch:

permissions:
  contents: read
  actions: read    # the plan asks whether this commit was already walked

concurrency:
  group: scan-screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      skip: ${{ steps.read.outputs.skip }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios-screens.yml/runs?head_sha=$GITHUB_SHA&per_page=30" > "$RUNNER_TEMP/runs.json" \
            || echo '{"workflow_runs": []}' > "$RUNNER_TEMP/runs.json"
          python3 ios/ci/screens-plan.py ios/UITests/RUN.txt "$RUNNER_TEMP/runs.json" "$GITHUB_RUN_ID" | tee -a "$GITHUB_OUTPUT"

  screens:
    needs: plan
    # A commit already walked with success (on the working branch, before it reached main) is not walked again;
    # a manual start always walks.
    if: github.event_name != 'push' || needs.plan.outputs.skip != 'true'
    name: ${{ matrix.label }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Select the project's Xcode (ios/ci/select-xcode.sh)
        run: |
          DEVELOPER_DIR=$(bash ios/ci/select-xcode.sh)
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$DEVELOPER_DIR" xcodebuild -version
      - name: Install pinned XcodeGen (2.46.0, SHA-256 verified)
        run: echo "XCODEGEN=$(bash ios/ci/install-xcodegen.sh)" >> "$GITHUB_ENV"
      # The two steps of tests do not stop the job: the walk runs whatever they say, and the last step of the
      # job fails when one of them failed.
      - name: The logic shared with the calculator's formats (ScanCore tests)
        id: scancore
        if: matrix.logic
        continue-on-error: true
        working-directory: ios/ScanCore
        run: |
          swift test > "$RUNNER_TEMP/scancore.log" 2>&1 || { grep -E "error:|XCTAssert|failed" "$RUNNER_TEMP/scancore.log" | cut -c1-400 | head -60; tail -15 "$RUNNER_TEMP/scancore.log"; exit 1; }
          grep -E "Executed [0-9]+ tests" "$RUNNER_TEMP/scancore.log" | tail -1
      - name: Apple's own readers open the sample USDZ made by the calculator
        # Reported, not blocking: the walk through the screens runs whatever this says.
        if: matrix.usdz
        continue-on-error: true
        run: |
          mkdir -p ios/build/screens
          MODEL=$(ls ios/UITests/Fixtures/Sessions/*/results/model.usdz | head -1)
          if xcrun --find usdchecker > /dev/null 2>&1; then
            xcrun usdchecker --arkit "$MODEL" || echo "usdchecker reported problems (status $?)"
          else
            echo "usdchecker is not installed on this machine"
          fi
          swift ios/ci/usdz-check.swift "$MODEL" ios/build/screens/usdz-vu-par-apple.png
      - name: Start the iPhone simulator
        env:
          DEVICE: ${{ matrix.device }}
          IOS_MAJOR: ${{ matrix.ios }}
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 ios/ci/pick-simulator.py "$IOS_MAJOR" "$DEVICE")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          sleep 20   # the home screen is still settling right after the start
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
      - name: Build the app and walk through its screens
        working-directory: ios
        env:
          WALKS: ${{ matrix.walks }}
        run: |
          mkdir -p build/screens
          "$XCODEGEN" generate --spec project.screens.yml
          xcodebuild build-for-testing -project DishPlayScreens.xcodeproj -scheme ScreenCheck \
            -destination "platform=iOS Simulator,id=$SIM_UDID" -derivedDataPath build/ScreensData \
            > build/screens-build.log 2>&1 || { grep -E "error:" build/screens-build.log | head -40; tail -40 build/screens-build.log; exit 1; }
          grep -E "warning: .*\.swift" build/screens-build.log | sort -u | cut -c1-300 | head -40 || true
          # The very first launch of an app on a fresh simulator can take a minute and make the first walk fail:
          # it is done here, outside the walks.
          APP=$(find build/ScreensData/Build/Products -maxdepth 2 -name "DishPlayScan.app" | head -1)
          xcrun simctl install "$SIM_UDID" "$APP"
          xcrun simctl launch "$SIM_UDID" app.dishplay.capture -uitest-sessions "$(mktemp -d)" || true
          sleep 25
          xcrun simctl terminate "$SIM_UDID" app.dishplay.capture || true
          status=0
          : > build/screens.log
          # One walk at a time: the appearance of the simulator is set from here before each of them (asked from
          # inside a walk, it did not change). A walk that fails is tried once more.
          for walk in ${WALKS:-test1Light test2Dark test3LargeText}; do
            if [ "$walk" = "test2Dark" ]; then appearance=dark; else appearance=light; fi
            xcrun simctl ui "$SIM_UDID" appearance "$appearance"
            sleep 3
            echo "== $walk, appearance: $(xcrun simctl ui "$SIM_UDID" appearance)"
            env TEST_RUNNER_SCREENS_DIR="$PWD/build/screens" xcodebuild test-without-building -project DishPlayScreens.xcodeproj \
              -scheme ScreenCheck -destination "platform=iOS Simulator,id=$SIM_UDID" -derivedDataPath build/ScreensData \
              -resultBundlePath "build/screens-$walk.xcresult" -retry-tests-on-failure -test-iterations 2 \
              "-only-testing:ScreenCheck/ScreenCheckTests/$walk" > "build/screens-$walk.log" 2>&1 || status=$?
            grep -E "error:|Test Case .*(passed|failed)|\*\* TEST|: error|Not on screen|not received|appearance during" "build/screens-$walk.log" | cut -c1-400 | head -60 || true
            cat "build/screens-$walk.log" >> build/screens.log
          done
          if [ "$status" != "0" ]; then echo "---- end of the full log ----"; tail -60 build/screens.log | cut -c1-600; fi
          ls build/screens | head -100
          exit "$status"
      # A finding that is not in the accepted list fails the job: either the app got worse, or the list is made
      # again on purpose (ios/ci/audit-compare.py --write) and the change is read in its diff.
      - name: No accessibility finding beyond the accepted list (ios/UITests/audit-baseline.txt)
        if: always() && matrix.logic
        working-directory: ios
        run: |
          if [ ! -f build/screens/audit.txt ]; then echo "the walk wrote no audit: nothing compared"; exit 0; fi
          python3 ci/audit-compare.py build/screens/audit.txt UITests/audit-baseline.txt
      - name: The app's own logic, tested inside the app (what is kept, resumed and deleted on the iPhone)
        id: apptests
        if: always() && matrix.logic
        continue-on-error: true
        working-directory: ios
        run: |
          xcodebuild test -project DishPlayScreens.xcodeproj -scheme AppTests \
            -destination "platform=iOS Simulator,id=$SIM_UDID" -derivedDataPath build/ScreensData \
            > build/app-tests.log 2>&1 || { grep -E "error:|XCTAssert|Test Case .* failed|\*\* TEST" build/app-tests.log | cut -c1-400 | head -60; tail -25 build/app-tests.log | cut -c1-400; exit 1; }
          grep -E "Test Case .* (passed|failed)" build/app-tests.log | cut -c1-200 | tail -40
          grep -E "Executed [0-9]+ tests" build/app-tests.log | tail -1
      - name: Pictures and audit findings as text (small copies, to be read from this log)
        if: always()
        working-directory: ios/build
        run: |
          mkdir -p small
          for f in screens/*.png; do
            [ -f "$f" ] || continue
            sips -Z 1300 -s format jpeg -s formatOptions 55 "$f" --out "small/$(basename "${f%.png}").jpg" > /dev/null
          done
          cp screens/audit.txt small/ 2>/dev/null || true
          echo "-----BEGIN SCREENS-----"
          COPYFILE_DISABLE=1 tar -cf - small | base64 -b 76
          echo "-----END SCREENS-----"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scan-screens-${{ matrix.slug }}
          path: |
            ios/build/screens
            ios/build/screens.log
            ios/build/screens-build.log
            ios/build/app-tests.log
          retention-days: 14
      - name: The tests of the app's logic passed
        if: always() && matrix.logic
        env:
          SCANCORE: ${{ steps.scancore.outcome }}
          APPTESTS: ${{ steps.apptests.outcome }}
        run: |
          echo "ScanCore tests: $SCANCORE · app tests: $APPTESTS"
          [ "$SCANCORE" = "success" ] && [ "$APPTESTS" = "success" ]
