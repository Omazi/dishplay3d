name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed build to App Store Connect for TestFlight
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: dishplay-testflight
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ios.yml
  distribute:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    environment:
      name: testflight
      url: https://appstoreconnect.apple.com/apps
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_KEY_ID: ${{ vars.APPLE_KEY_ID }}
      APPLE_ISSUER_ID: ${{ vars.APPLE_ISSUER_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'app.dishplay.capture' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate and install signing material
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: python3 scripts/apple/install-signing.py
      - name: Download pinned project generator
        run: bash scripts/apple/xcodegen.sh
      - name: Archive with the validated distribution identity
        working-directory: native/ios
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -project DishPlayCapture.xcodeproj -scheme DishPlayCapture \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/DishPlayCapture.xcarchive -derivedDataPath build/DerivedData \
            -jobs 1 \
            "PRODUCT_BUNDLE_IDENTIFIER=$IOS_BUNDLE_ID" \
            "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
            "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            "PROVISIONING_PROFILE_SPECIFIER=$SIGNING_PROFILE_UUID" \
            "OTHER_CODE_SIGN_FLAGS=--keychain $SIGNING_KEYCHAIN" archive
      - name: Validate the packaged release resources
        run: python3 scripts/apple/validate-bundle.py native/ios/build/DishPlayCapture.xcarchive/Products/Applications/DishPlayCapture.app
      - name: Export signed IPA
        working-directory: native/ios
        run: |
          xcodebuild -exportArchive -archivePath build/DishPlayCapture.xcarchive \
            -exportPath build/export -exportOptionsPlist "$APPLE_EXPORT_OPTIONS"
      - name: Validate with Apple and upload for TestFlight processing
        if: inputs.upload
        working-directory: native/ios
        run: |
          export API_PRIVATE_KEYS_DIR="$(dirname "$APPLE_API_KEY_PATH")"
          xcrun altool --validate-app --type ios --file build/export/DishPlayCapture.ipa \
            --apiKey "$APPLE_KEY_ID" --apiIssuer "$APPLE_ISSUER_ID"
          xcrun altool --upload-app --type ios --file build/export/DishPlayCapture.ipa \
            --apiKey "$APPLE_KEY_ID" --apiIssuer "$APPLE_ISSUER_ID"
      - name: Keep only the signed build and debug symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dishplay-testflight-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            native/ios/build/export/*.ipa
            native/ios/build/DishPlayCapture.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        run: python3 scripts/apple/cleanup-signing.py
