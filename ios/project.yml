name: DishPlayScan
options:
  bundleIdPrefix: app.dishplay
  deploymentTarget:
    iOS: "17.0"
  minimumXcodeGenVersion: "2.46.0"
packages:
  ScanCore:
    path: ScanCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"  # record already supports iPad; an update cannot drop it
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.3.2"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: XQGND2V48C
targets:
  DishPlayScan:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Scanner
      - path: Preview
      - path: Network
      - path: Storage
    dependencies:
      - package: ScanCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dishplay.capture  # existing App Store Connect record 6814221035 (DishPlay Capture)
        PRODUCT_NAME: DishPlayScan
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        MTL_FAST_MATH: YES
schemes:
  DishPlayScan:
    build:
      targets:
        DishPlayScan: all
    archive:
      config: Release
